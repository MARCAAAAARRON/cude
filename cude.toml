# cude.toml — Hybrid Local/API Coding Agent Configuration
#
# Copy this file to ~/.config/cude/cude.toml or place it in your project root.

default_model = "llama3.2"
default_backend = "ollama"

# ── Local Runtimes ──────────────────────────────────────────

[models.llama3_2]
backend = "ollama"
model = "llama3.2:3b"
endpoint = "http://localhost:11434"
context_window = 8192
tier = "local"

[models.lmstudio_qwen]
backend = "openai"              # LM Studio exposes OpenAI-compatible API
model = "qwen2.5-coder-7b"     # model loaded in LM Studio
endpoint = "http://localhost:1234/v1"
api_key = "lm-studio"           # LM Studio ignores the key, but field is required
context_window = 32768
tier = "local"                  # treated as local for routing & compensation

# ── API Backends ────────────────────────────────────────────

[models.claude]
backend = "anthropic"
model = "claude-sonnet-4-20250514"
api_key = "$ANTHROPIC_API_KEY"
context_window = 200000
tier = "api"

[models.openrouter]
backend = "openai"
model = "anthropic/claude-sonnet-4-20250514"
endpoint = "https://openrouter.ai/api/v1"
api_key = "$OPENROUTER_API_KEY"
context_window = 200000
tier = "api"

# ── Agent Behavior ──────────────────────────────────────────

[agent]
max_iterations = 25
auto_escalate = false           # auto-switch to API on local model failure
escalate_threshold = 3          # consecutive failures before escalation prompt
approve_writes = true           # require user approval for file writes
approve_shell = true            # require user approval for shell commands

# ── TUI ─────────────────────────────────────────────────────

[tui]
splash_duration_ms = 1200
show_cost = true
